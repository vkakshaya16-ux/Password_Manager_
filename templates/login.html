<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass card */
.container {
    width: 350px;
    padding: 35px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
    color: white;
}

/* Title */
.container h2 {
    margin-bottom: 20px;
}

/* Input fields */
.input-box {
    position: relative;
    margin: 15px 0;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 14px;
}

.input-box input::placeholder {
    color: #ddd;
}

/* Show password icon */
.toggle {
    position: absolute;
    right: 10px;
    top: 12px;
    cursor: pointer;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(to right, #00c9ff, #92fe9d);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px #00c9ff;
}

/* Link */
.link {
    margin-top: 15px;
}

.link a {
    color: white;
    text-decoration: underline;
}

/* Flash message */
.flash {
    background: rgba(255,0,0,0.3);
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
}

/* Responsive */
@media (max-width: 400px) {
    .container {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>🔐 Password Manager</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        <p>New user? <a href="/register">Create Account</a></p>
    </div>
</div>

<script>
function togglePassword() {
    let pwd = document.getElementById("password");

    if (pwd.type === "password") {
        pwd.type = "text";
    } else {
        pwd.type = "password";
    }
}
</script>

</body>
</html>
