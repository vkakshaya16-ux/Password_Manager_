<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff7e5f,#feb47b);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:350px;
    padding:35px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

.container h2{
    margin-bottom:20px;
}

.input-box{
    position:relative;
    margin:15px 0;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
}

.input-box input::placeholder{
    color:#eee;
}

.toggle{
    position:absolute;
    right:10px;
    top:12px;
    cursor:pointer;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(to right,#ff9966,#ff5e62);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 10px #ff9966;
}

.link{
    margin-top:15px;
}

.link a{
    color:white;
    text-decoration:underline;
}

.flash{
    background:rgba(255,0,0,0.3);
    padding:8px;
    border-radius:6px;
    margin-bottom:10px;
}

.strength{
    text-align:left;
    font-size:12px;
    margin-top:5px;
}

@media(max-width:400px){
    .container{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>📝 Create Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/register_user" method="POST">

        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" required onkeyup="checkStrength()">
            <span class="toggle" onclick="togglePassword()">👁</span>
        </div>

        <div class="strength" id="strength"></div>

        <button type="submit">Register</button>

    </form>

    <div class="link">
        <p>Already have an account? <a href="/">Login</a></p>
    </div>

</div>

<script>
function togglePassword(){

    let pwd=document.getElementById("password");

    pwd.type = (pwd.type==="password") ? "text" : "password";
}

function checkStrength(){

    let pwd=document.getElementById("password").value;

    let strength=document.getElementById("strength");

    if(pwd.length < 6){
        strength.innerHTML="Weak password";
        strength.style.color="red";
    }
    else if(/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)){
        strength.innerHTML="Strong password";
        strength.style.color="lightgreen";
    }
    else{
        strength.innerHTML="Medium password";
        strength.style.color="yellow";
    }
}
</script>

</body>
</html>
