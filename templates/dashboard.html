<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:20px;
    transition:0.3s;
}

.dark{
    background:#121212;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.container{
    max-width:950px;
    margin:auto;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:15px;
}

input{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:6px;
}

.search{
    width:100%;
    margin-bottom:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:10px;
    text-align:center;
}

tr{
    background:rgba(255,255,255,0.1);
}

tr:hover{
    background:rgba(255,255,255,0.2);
}

.strength{
    font-size:12px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
    <h2>🔐 Password Manager</h2>

    <div>
        <button onclick="toggleDark()">🌙</button>
        <a href="/logout">
            <button style="background:red;color:white;">Logout</button>
        </a>
    </div>
</div>

<div class="container">

    <!-- Search -->
    <input type="text" id="search" class="search" placeholder="🔍 Search..." onkeyup="filterTable()">

    <!-- Add Password Form -->
    <form action="/add" method="POST">

        <input type="text" name="site" placeholder="App Name" required>

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" id="pwd" name="password" placeholder="Password" required onkeyup="checkStrength()">

        <button type="button" onclick="generatePassword()">⚡ Generate</button>

        <button type="submit">Save</button>

    </form>

    <div id="strength" class="strength"></div>

    <!-- Table -->
    <table id="table">

        <tr>
            <th>App</th>
            <th>Username</th>
            <th>Password</th>
            <th>Actions</th>
        </tr>

        {% for p in passwords %}
        <tr>
            <td>{{ p.site }}</td>
            <td>{{ p.username }}</td>

            <td>
                <span id="pwd{{ p.id }}">******</span>
            </td>

            <td>

                <button onclick="togglePwd('{{ p.id }}','{{ p.password }}')">👁</button>

                <button onclick="copyPwd('{{ p.password }}')">📋</button>

                <a href="/delete/{{ p.id }}">
                    <button type="button">🗑</button>
                </a>

            </td>
        </tr>
        {% endfor %}

    </table>

</div>

<script>

// Show / Hide Password
function togglePwd(id,pwd){
    let el=document.getElementById("pwd"+id);

    if(el.innerText==="******"){
        el.innerText=pwd;
    }else{
        el.innerText="******";
    }
}

// Copy Password
function copyPwd(text){
    navigator.clipboard.writeText(text);
    alert("Password Copied!");
}

// Search Filter
function filterTable(){

    let input=document.getElementById("search").value.toLowerCase();

    let rows=document.querySelectorAll("#table tr");

    rows.forEach((row,index)=>{

        if(index===0) return;

        row.style.display=row.innerText.toLowerCase().includes(input) ? "" : "none";

    });
}

// Generate Password
function generatePassword(){

    let chars="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$!";

    let pwd="";

    for(let i=0;i<10;i++){

        pwd += chars[Math.floor(Math.random()*chars.length)];

    }

    document.getElementById("pwd").value=pwd;

    checkStrength();
}

// Password Strength
function checkStrength(){

    let pwd=document.getElementById("pwd").value;

    let s=document.getElementById("strength");

    if(pwd.length<6){

        s.innerText="Weak";
        s.style.color="red";

    }
    else if(/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)){

        s.innerText="Strong";
        s.style.color="lightgreen";

    }
    else{

        s.innerText="Medium";
        s.style.color="yellow";

    }
}

// Dark Mode
function toggleDark(){

    document.body.classList.toggle("dark");

}

</script>

</body>
</html>
