<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 20px;
    transition: 0.3s;
}

.dark {
    background: #121212;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

/* Buttons */
button {
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* Container */
.container {
    max-width: 950px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 15px;
}

/* Inputs */
input {
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: none;
}

/* Table */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: center;
}

tr {
    background: rgba(255,255,255,0.1);
}

/* Search */
.search {
    width: 100%;
    margin-bottom: 10px;
}

/* Strength */
.strength {
    font-size: 12px;
}

/* Hover */
tr:hover {
    background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="header">
    <h2>🔐 Password Manager</h2>
    <div>
        <button onclick="toggleDark()">🌙</button>
        <a href="/logout"><button style="background:red;color:white;">Logout</button></a>
    </div>
</div>

<div class="container">

    <!-- Search -->
    <input type="text" id="search" class="search" placeholder="🔍 Search..." onkeyup="filterTable()">

    <!-- Add Form -->
    <form method="POST">
        <input type="text" name="app_name" placeholder="App Name" required>
        <input type="text" name="app_username" placeholder="Username" required>
        <input type="password" id="pwd" name="app_password" placeholder="Password" required onkeyup="checkStrength()">
        <button type="button" onclick="generatePassword()">⚡ Generate</button>
        <button type="submit">Save</button>
    </form>

    <div id="strength" class="strength"></div>

    <!-- Table -->
    <table id="table">
        <tr>
            <th>App</th>
            <th>Username</th>
            <th>Password</th>
            <th>Actions</th>
        </tr>

        {% for p in passwords %}
        <tr>
            <td>{{ p.app_name }}</td>
            <td>{{ p.app_username }}</td>
            <td><span id="pwd{{ p.id }}">******</span></td>
            <td>
                <button onclick="togglePwd('{{ p.id }}','{{ p.app_password }}')">👁</button>
                <button onclick="copyPwd('{{ p.app_password }}')">📋</button>
                <form action="/delete/{{ p.id }}" method="POST" style="display:inline;">
                    <button>🗑</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

<script>
// Show/Hide Password
function togglePwd(id, pwd) {
    let el = document.getElementById("pwd"+id);
    el.innerText = (el.innerText === "******") ? pwd : "******";
}

// Copy
function copyPwd(text) {
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

// Search
function filterTable() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, index) => {
        if (index === 0) return;
        row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}

// Password Generator
function generatePassword() {
    let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$!";
    let pwd = "";
    for (let i=0; i<10; i++) {
        pwd += chars[Math.floor(Math.random()*chars.length)];
    }
    document.getElementById("pwd").value = pwd;
    checkStrength();
}

// Strength
function checkStrength() {
    let pwd = document.getElementById("pwd").value;
    let s = document.getElementById("strength");

    if (pwd.length < 6) {
        s.innerText = "Weak";
        s.style.color = "red";
    } else if (/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) {
        s.innerText = "Strong";
        s.style.color = "lightgreen";
    } else {
        s.innerText = "Medium";
        s.style.color = "yellow";
    }
}

// Dark Mode
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
